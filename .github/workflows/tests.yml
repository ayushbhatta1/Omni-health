name: tests
on:
  push:
  pull_request:
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Only the web layer is installed; the tests swap in a fake for the ML models
      - run: pip install fastapi==0.104.1 python-multipart==0.0.20 "httpx<0.28" pytest
      - run: pytest -q tests/
